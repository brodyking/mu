<!DOCTYPE html>
<html lang="en">
	<head>
		<title>muweb</title>
		<link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.9.0/dist/css/coreui.min.css" rel="stylesheet" integrity="sha384-9DZ6o3pJWcTwBR8W196XizUEf2kNMD35tkeyWqOB0yzml+nZrEe/13PMCpAIrT4r" crossorigin="anonymous">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
		<link href=" https://cdn.jsdelivr.net/npm/clusterize.js@1.0.0/clusterize.min.css " rel="stylesheet">
		<link href="/css/styles.css" rel="stylesheet">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">
	</head>
	<body>
		<div id="login" style="max-width: 300px;margin:auto;margin-top:150px;" class="border p-3">
			<h2 class="text-center">µ</h2>
			<p class="text-center">login is required</p>
			<p class="text-danger text-center d-none" id="loginFormIncorrect">incorrect password</p>
			<p class="text-success text-center d-none" id="loginFormCorrect">correct password</p>
			<form id="loginForm">
				<input class="form-control mb-3 rounded-0" type="password" title="password" placeholder="password" id="loginFormPassword">
				<input type="submit" value="login" class="btn w-100 border">
			</form>
		</div>
		<script>
			document.getElementById("loginForm").addEventListener("submit", async (event) => {
				event.preventDefault();
				password = document.getElementById("loginFormPassword").value
				const res = await fetch("/api/auth/login", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ password }),
				});
			if (await res.json()) {
				document.getElementById("loginFormIncorrect").classList.add("d-none");
				document.getElementById("loginFormCorrect").classList.remove("d-none");
				const sleep = ms => new Promise(res => setTimeout(res, ms));
				await sleep(200);
				window.location.reload();
			} else {
				document.getElementById("loginFormIncorrect").classList.remove("d-none");
			}
		});
		</script>
		<script src="/js/theme.js" defer></script>
		<script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.9.0/dist/js/coreui.bundle.min.js" integrity="sha384-FTek6QoTuxz6Bb078pS0kYQ0qH2LZVB5LWwZl8944mluH+TCk0q3OP4PqA+dHJRl" crossorigin="anonymous"></script>
		<script src=" https://cdn.jsdelivr.net/npm/clusterize.js@1.0.0/clusterize.min.js "></script>
	</body>
</html>
