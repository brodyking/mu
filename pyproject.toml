[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ms = "ms.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ms/"]

[project]
name = "ms"
version = "1.0.0"
requires-python = ">=3.14.0"
description = "Based Music Server"
dependencies = [
    "mutagen"
]
